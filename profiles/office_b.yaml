customer: office_b
equipment_list:
  file: equipment_list.xlsx
  format: xlsx
  delimiter: ','
  sheet: null
  header_row: 3
  columns:
    tag:
      source: Item No.
      scale: 1.0
    name:
      source: Description
      scale: 1.0
    space:
      source: Location
      scale: 1.0
    mass_kg:
      source: Mass (t)
      scale: 1000.0
tag_convention:
  pattern: ^\d{3}\.\d{2}-[A-Z]{3}-\d{2}$
  example: 601.01-ENG-01
drawing:
  file: ga_drawing.dxf
  layer: M_EQUIP
  source: attrib
  attribute: TAG
rules:
- id: DS-11
  type: max_total_mass_per_space
  limit_kg: 25000.0
  space: null
  source_text: 'DS-11: No single room may carry more than 25,000 kg of equipment.'
